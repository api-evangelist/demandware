apis:
- name: B2C Commerce API (SCAPI)
  description: The modern Salesforce Commerce API (SCAPI) — Shopper APIs (products, search, baskets, orders, customers),
    Admin APIs, and the Shopper Login and API Access Service (SLAS). Published as OpenAPI, secured with OAuth2 (SLAS
    for Shopper APIs, Account Manager for Admin APIs) using JWT Bearer access tokens.
  humanURL: https://developer.salesforce.com/docs/commerce/commerce-api/overview
  baseURL: https://api.commercecloud.salesforce.com
  properties:
  - type: APIReference
    url: https://developer.salesforce.com/docs/commerce/commerce-api/references
  - type: GettingStarted
    url: https://developer.salesforce.com/docs/commerce/commerce-api/guide/get-started.html
- name: Open Commerce API (OCAPI)
  description: The legacy Open Commerce API (OCAPI, deprecated in favor of SCAPI) — the Shop API for shopper interactions,
    the Data API for CRUD against instance data, and the Meta API for retrieving formal API descriptions. Swagger
    2.0 based, secured with OAuth2 via Account Manager.
  humanURL: https://developer.salesforce.com/docs/commerce/b2c-commerce/references/b2c-commerce-ocapi
  baseURL: https://api.commercecloud.salesforce.com
  properties:
  - type: APIReference
    url: https://developer.salesforce.com/docs/commerce/b2c-commerce/references/b2c-commerce-ocapi/apiexplorer.html
