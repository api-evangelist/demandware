aid: demandware
name: Demandware
description: 'Demandware is the cloud commerce platform now sold by Salesforce as Salesforce B2C Commerce Cloud.
  Founded in 2004 and taken public on the NYSE (DWRE) in 2012, Demandware was acquired by Salesforce in 2016 for
  roughly $2.8B and rebranded as Salesforce Commerce Cloud. Its developer surface centers on two REST API families:
  the modern B2C Commerce API (SCAPI) — Shopper APIs, Admin APIs, and the Shopper Login and API Access Service (SLAS)
  — published as OpenAPI, and the older Open Commerce API (OCAPI, now deprecated) with its Shop, Data, and Meta
  APIs. The platform ships first-party SDKs (commerce-sdk, commerce-sdk-isomorphic, PWA Kit), a B2C CLI (sfcc-ci
  and the newer @salesforce/b2c-cli), a developer-experience MCP server, packaged Agent Skills, and Account Manager
  / SLAS OAuth2 authentication.'
